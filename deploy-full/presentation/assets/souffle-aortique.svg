<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">Souffle systolique éjectionnel du rétrécissement aortique</title>
  <desc id="desc">Schéma simplifié : bruit B1, souffle crescendo puis decrescendo pendant la systole, bruit B2, puis diastole sans souffle représenté. Ce dessin n’est pas un enregistrement clinique.</desc>
  <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3479ed" stop-opacity=".3"/><stop offset="1" stop-color="#3479ed" stop-opacity=".04"/></linearGradient><clipPath id="envelope"><path d="M139 252 Q180 220 250 123 Q303 200 348 252 L348 265 Q303 317 250 374 Q180 295 139 265Z"/></clipPath></defs>
  <rect width="640" height="440" rx="18" fill="#f8fbff"/>
  <text x="36" y="43" font-family="sans-serif" font-size="16" fill="#35577d">AUSCULTATION · SCHÉMA SIMPLIFIÉ</text>
  <text x="36" y="77" font-family="sans-serif" font-size="23" font-weight="600" fill="#17385d">Souffle systolique éjectionnel</text>
  <rect x="111" y="104" width="274" height="282" rx="9" fill="#edf4ff"/>
  <path d="M49 259H590" fill="none" stroke="#9aafc8" stroke-width="2"/>
  <path d="M139 252 Q180 220 250 123 Q303 200 348 252 L348 265 Q303 317 250 374 Q180 295 139 265Z" fill="url(#fill)"/>
  <g clip-path="url(#envelope)" stroke="#2868ce" stroke-width="2" fill="none"><path d="M139 259l5-160 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320 5-320 5 320"/></g>
  <path d="M91 259l4-48 4 89 4-62 4 21M372 259l4-42 4 78 4-54 4 18M572 259l4-48 4 89 4-62 4 21" stroke="#163c6b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g font-family="sans-serif" font-size="18" fill="#264d7b" text-anchor="middle"><text x="100" y="190">B1</text><text x="380" y="190">B2</text><text x="580" y="190">B1</text></g>
  <g font-family="sans-serif" font-size="15" fill="#325e95" text-anchor="middle"><text x="244" y="407">SYSTOLE</text><text x="483" y="407">DIASTOLE</text></g>
</svg>
