# Inside the existing Nginx server block for setup-hub.com.
# Put the hashed-assets location BEFORE an existing regex matching CSS/JS.
# Uses the server's existing root; do not change routing for the API or other apps.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain text/vtt;

location ~ ^/itemstracker/presentation/.*\.[a-f0-9]{16}\.(css|js|woff2|svg|png|jpe?g|webp)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /itemstracker/ {
    try_files /itemstracker/index.html =404;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate";
}

location = /itemstracker/index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate";
}

location = /robots.txt {
    try_files $uri =404;
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600";
}

location = /llms.txt {
    try_files $uri =404;
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600";
}
