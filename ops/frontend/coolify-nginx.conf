# Paste into the frontend's Custom Nginx Configuration in Coolify.
# Supports both preserved and stripped /itemstracker/ proxy paths.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/vtt;

    rewrite ^/itemstracker/(.*)$ /$1 last;

    location = /healthz { return 200 "ok\n"; }
    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /llms.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/presentation/.*\.[a-f0-9]{16}\.(css|js|woff2|svg|png|jpe?g|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }
}
